        <p>SCTY Lab</p>
        <h1>A shared whiteboard you host yourself.</h1>
        <p>
          web-draw is SCTY's fork of ExcaliDash, a self-hosted workspace for
          Excalidraw drawings with collections, live collaboration, sharing and
          version history. It is for teams who want their whiteboards on their
          own server. This fork adds a Copilot: say what you want, or paste
          Markdown or code, and it draws on the canvas.
        </p>
        <h2>Quickstart</h2>
        <pre>git clone https://github.com/SCTY-Inc/web-draw.git
cd web-draw
docker compose -f docker-compose.prod.yml up -d</pre>
        <p>
          Then open http://localhost:6767. These commands run the published
          upstream ExcaliDash images, without the Copilot. The app needs
          JavaScript.
        </p>
        <p>
          <a href="https://github.com/SCTY-Inc/web-draw">GitHub</a> ·
          <a href="https://github.com/ZimengXiong/ExcaliDash">ExcaliDash</a> ·
          <a href="https://scty.org/lab">SCTY Lab</a> ·
          <a href="/login">Sign in</a>
        </p>
      </main>
    </noscript>
    <script>
      (function () {
        if (
          typeof window.EXCALIDRAW_ASSET_PATH === "string" &&
          window.EXCALIDRAW_ASSET_PATH.length > 0
        )
          return;
        var base = "%BASE_URL%";
        if (base === "%BASE_URL%") base = "/";
        if (base && base[base.length - 1] !== "/") base += "/";
        window.EXCALIDRAW_ASSET_PATH = new URL(
          base || "/",
          window.location.origin,
        ).toString();
      })();
    </script>
